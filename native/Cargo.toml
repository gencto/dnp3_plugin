[package]
name = "dnp3_dart"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "C ABI bridge between the stepfunc `dnp3` crate and Dart (FFI, isolates, zero-copy)"
license = "MIT"
publish = false

[lib]
name = "dnp3_dart"
crate-type = ["cdylib"]

[dependencies]
# Base feature set used on every target. `ffi` relaxes `non_exhaustive` on a few enums
# and exposes the constructors used by bindings.
dnp3 = { version = "=1.7.0", default-features = false, features = ["tls", "ffi"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Serial ports are not available on Apple mobile platforms / wasm. Everywhere else the
# feature is enabled through a target-specific dependency (features are additive).
[target.'cfg(not(any(target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos", target_family = "wasm")))'.dependencies]
dnp3 = { version = "=1.7.0", default-features = false, features = ["tls", "ffi", "serial"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
debug = false
