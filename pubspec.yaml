name: dnp3
description: >-
  DNP3 (IEEE 1815) master and outstation for Dart and Flutter on top of the stepfunc
  dnp3 Rust library, with zero-copy measurements and isolate-friendly handles.
version: 0.3.1
repository: https://github.com/gencto/dnp3_plugin
issue_tracker: https://github.com/gencto/dnp3_plugin/issues
topics:
  - dnp3
  - scada
  - ffi
  - industrial
  - protocol

environment:
  sdk: ^3.10.0

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  code_assets: ^2.0.0
  hooks: ^2.0.0
  logging: ^1.3.0
  ffi: ^2.1.0
  meta: ^1.15.0

dev_dependencies:
  benchmark_harness: ^2.3.0
  lints: ^6.0.0
  test: ^1.26.0
