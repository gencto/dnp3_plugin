name: dnp3
description: >-
  Complete DNP3 (IEEE 1815) master & outstation for Dart and Flutter, built on the
  stepfunc `dnp3` Rust library. Zero-copy measurement delivery, isolate-friendly handles,
  batched database transactions. Android, iOS, macOS, Linux and Windows.
version: 0.2.0
repository: https://github.com/gencto/dnp3_plugin
publish_to: none

environment:
  sdk: ^3.10.0

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  code_assets: ^2.0.0
  hooks: ^2.0.0
  logging: ^1.3.0
  ffi: ^2.1.0
  meta: ^1.15.0

dev_dependencies:
  benchmark_harness: ^2.3.0
  lints: ^6.0.0
  test: ^1.26.0
