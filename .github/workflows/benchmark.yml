name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

jobs:
  benchmark:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Run benchmarks
        shell: bash
        run: dart run benchmark/run_all.dart --out "results/${{ runner.os }}-${{ runner.arch }}.md"
      - name: Summary
        shell: bash
        run: cat results/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ runner.os }}-${{ runner.arch }}
          path: results/
