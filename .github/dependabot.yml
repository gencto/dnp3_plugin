version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: weekly
    ignore:
      # the dnp3 crate is pinned on purpose; upgrade together with the bindings
      - dependency-name: dnp3
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
